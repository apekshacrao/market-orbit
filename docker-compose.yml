version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marketing_analyzer_db
    environment:
      POSTGRES_DB: marketing_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketing_analyzer_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/marketing_analyzer
      SECRET_KEY: dev-secret-key
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketing_analyzer_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
